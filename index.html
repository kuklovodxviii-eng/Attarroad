<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Attar Road</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0F3B2E;--deep:#082A20;--g:#D9B36A;--gl:#F0D78C;--m:#B9D4C8}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:#fff;font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:90px}
h1{font:700 26px Georgia,serif;letter-spacing:5px;color:var(--g);text-align:center;padding:18px 0 2px}
.sub{text-align:center;color:var(--m);font-size:11px;letter-spacing:2px;padding-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 12px 12px}.chip{flex:none;padding:7px 14px;border:1px solid var(--g);border-radius:20px;color:var(--g);background:none;font-size:14px}
.chip.on{background:var(--g);color:var(--deep);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
.card{background:var(--deep);border:1px solid #1d5a47;border-radius:12px;overflow:hidden}
.ph{aspect-ratio:1;background:#0b3327 center/cover;display:flex;align-items:center;justify-content:center;color:var(--g);font-size:34px}
.ci{padding:8px 10px}.b{color:var(--m);font-size:12px}.n{font-weight:600}.p{color:var(--g);margin-top:2px}
.sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:16px;display:none}.sheet.open{display:block}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--g);color:var(--deep);font-weight:700;font-size:16px;margin-top:12px}
.ghost{background:none;color:var(--g);border:1px solid var(--g)}
.var{display:flex;justify-content:space-between;padding:12px;border:1px solid #1d5a47;border-radius:10px;margin-top:8px;background:var(--deep)}
.var.on{border-color:var(--g)}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:none}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #1d5a47}
.q button{width:30px;height:30px;border-radius:15px;border:1px solid var(--g);background:none;color:var(--g);font-size:18px}
input,textarea{width:100%;padding:12px;margin-top:8px;border-radius:10px;border:1px solid #1d5a47;background:var(--deep);color:#fff;font-size:15px}
.t{color:var(--g);font-size:20px;font-weight:700;margin:10px 0}
</style></head><body>
<h1>ATTAR ROAD</h1><div class="sub">ПАРФЮМЕРИЯ · МАСЛА · РАЗЛИВ</div>
<div class="chips" id="chips"></div><div class="grid" id="grid"></div>
<div class="bar" id="bar"><button class="btn" id="barBtn"></button></div>
<div class="sheet" id="sheet"></div>
<script>
const CATALOG_URL="https://docs.google.com/spreadsheets/d/1-27Lt3FaP943bci-HTlGqphP8RK-y11e8_dl9OTIYWU/gviz/tq?tqx=out:csv"; // каталог из Google Таблицы
const DEMO=[
{category:"Отливанты",brand:"Brand",name:"Демо-аромат 1",description:"Тестовый товар. Замените каталог своей таблицей.",img:"",variants:"3 мл:450;5 мл:700;10 мл:1200"},
{category:"Масляные духи",brand:"Attar",name:"Демо-аттар",description:"Масляные духи.",img:"",variants:"6 мл:900;12 мл:1600"},
{category:"Разлив",brand:"Brand",name:"Демо-разлив",description:"Цена указана за объём.",img:"",variants:"30 мл:2500;50 мл:3900"}];
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let items=[],cat="Все",cart=[];
function csv(t){const r=[];let w=[],c="",q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=h}else if(h=='"')q=true;else if(h==','){w.push(c);c=""}else if(h=='\n'){w.push(c);r.push(w);w=[];c=""}else if(h!='\r')c+=h}w.push(c);r.push(w);return r}
function parse(t){const r=csv(t),h=r[0].map(x=>x.trim().toLowerCase());return r.slice(1).filter(x=>x.length>1).map(x=>{const o={};h.forEach((k,i)=>o[k]=(x[i]||"").trim());return o}).filter(o=>o.name&&!["0","нет","no"].includes((o.active||"").toLowerCase()))}
const vars=it=>(it.variants||"").split(";").map(s=>{const i=s.lastIndexOf(":");return{v:s.slice(0,i).trim(),p:+s.slice(i+1)}}).filter(x=>x.v&&x.p>0);
const money=n=>n.toLocaleString("ru-RU")+" ₽";
async function load(){try{if(CATALOG_URL){const r=await fetch(CATALOG_URL);items=parse(await r.text())}else items=DEMO}catch(e){items=DEMO}render()}
function render(){const cats=["Все",...new Set(items.map(i=>i.category).filter(Boolean))];
$("chips").innerHTML=cats.map(c=>`<button class="chip ${c==cat?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
$("grid").innerHTML=items.map((it,i)=>[it,i]).filter(([it])=>cat=="Все"||it.category==cat).map(([it,i])=>{const v=vars(it);return`<div class="card" data-i="${i}"><div class="ph" style="${it.img?`background-image:url('${esc(it.img)}')`:""}">${it.img?"":"💧"}</div><div class="ci"><div class="b">${esc(it.brand)}</div><div class="n">${esc(it.name)}</div><div class="p">${v.length?"от "+money(Math.min(...v.map(x=>x.p))):""}</div></div></div>`}).join("");
const n=cart.reduce((a,x)=>a+x.q,0),s=cart.reduce((a,x)=>a+x.q*x.p,0);$("bar").style.display=n?"block":"none";$("barBtn").textContent=`Корзина · ${n} · ${money(s)}`}
$("chips").onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;render()}};
$("grid").onclick=e=>{const c=e.target.closest(".card");if(c)product(+c.dataset.i)};
function open(h){$("sheet").innerHTML=h;$("sheet").classList.add("open");scrollTo(0,0)}function close(){$("sheet").classList.remove("open");render()}
function product(i){const it=items[i],v=vars(it);let sel=0;
open(`<button class="btn ghost" id="x" style="margin:0 0 12px">← Назад</button><div class="ph" style="border-radius:12px;${it.img?`background-image:url('${esc(it.img)}')`:""}">${it.img?"":"💧"}</div><div class="b" style="margin-top:10px">${esc(it.brand)}</div><div class="t" style="margin:0">${esc(it.name)}</div><p style="color:var(--m);margin-top:6px">${esc(it.description)}</p><div id="vs"></div><button class="btn" id="add">В корзину</button>`);
const draw=()=>$("vs").innerHTML=v.map((x,k)=>`<div class="var ${k==sel?"on":""}" data-k="${k}"><span>${esc(x.v)}</span><b style="color:var(--g)">${money(x.p)}</b></div>`).join("");draw();
$("vs").onclick=e=>{const d=e.target.closest(".var");if(d){sel=+d.dataset.k;draw()}};$("x").onclick=close;
$("add").onclick=()=>{if(!v.length)return;const x=v[sel],key=it.name+"|"+x.v,f=cart.find(c=>c.key==key);f?f.q++:cart.push({key,name:(it.brand?it.brand+" — ":"")+it.name,v:x.v,p:x.p,q:1});close()}}
$("barBtn").onclick=checkout;
function checkout(){const s=cart.reduce((a,x)=>a+x.q*x.p,0);
open(`<button class="btn ghost" id="x" style="margin:0 0 8px">← Назад</button><div class="t">Корзина</div>${cart.map((c,i)=>`<div class="row"><div>${esc(c.name)}<div class="b">${esc(c.v)} · ${money(c.p)}</div></div><div class="q"><button data-d="-1" data-i="${i}">−</button> ${c.q} <button data-d="1" data-i="${i}">+</button></div></div>`).join("")}<div class="t">Итого: ${money(s)}</div><input id="fn" placeholder="Имя"><input id="fp" placeholder="Телефон" type="tel"><input id="fc" placeholder="Город и страна"><textarea id="fa" rows="2" placeholder="Адрес / пункт выдачи (СДЭК, Почта)"></textarea><textarea id="fm" rows="2" placeholder="Комментарий"></textarea><button class="btn" id="go">Оформить заказ</button>`);
$("x").onclick=close;$("sheet").onclick=e=>{const b=e.target;if(b.dataset.d){const c=cart[+b.dataset.i];c.q+=+b.dataset.d;if(c.q<1)cart.splice(+b.dataset.i,1);cart.length?checkout():close()}};
$("go").onclick=()=>{const o={name:$("fn").value.trim(),phone:$("fp").value.trim(),city:$("fc").value.trim(),address:$("fa").value.trim(),comment:$("fm").value.trim(),total:s,items:cart.map(c=>({n:c.name,v:c.v,p:c.p,q:c.q}))};
if(!o.name||!o.phone||!o.city){alert("Заполните имя, телефон и город");return}
if(tg&&tg.sendData)tg.sendData(JSON.stringify(o));else alert("Тест вне Telegram:\n"+JSON.stringify(o,null,1))}}
load();
</script></body></html>
